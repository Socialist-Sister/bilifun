<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>BiliFun</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body style="width: 340px">
    <main style="margin: 18px 0; padding: 0 18px 18px">
      <h1 style="font-size: 20px">BiliFun</h1>
      <p class="muted">搜索、下载和弹幕工具</p>
      <div class="actions">
        <button id="search" class="primary">打开独立搜索</button>
        <button id="tools">打开工具中心</button
        ><button id="settings">设置</button>
      </div>
      <p id="status" role="status"></p>
      <small>视频页右侧也有工具入口。媒体与接口权限在使用时申请。</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
